spring:
  application:
    name: sd-payment-order

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  bian:
    serviceDomain: "Payment Order"
    businessArea: "Operations and Execution"
    businessDomain: "Payments"
    functionalPattern: "Process"
    assetType: "Payment Order"
    controlRecord: "Payment Order Procedure"
    phase: "2b-deep"

bian:
  payments:
    # Per-order ceiling; above it the order is REJECTED at intake.
    max-order-minor: 50000000      # ₹500,000 in paise
    # Valid orders hand off to Payment Execution immediately. Set false to hold
    # orders in VALIDATED for an explicit POST /{id}/submit step.
    auto-submit: true

resilience4j:
  circuitbreaker:
    instances:
      serviceDomain:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
