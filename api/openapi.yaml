# API contract — owned by THIS repo (contract-per-repo). Phase 2b-c: real domain.
openapi: 3.0.3
info:
  title: "Payment Order — BIAN Semantic API"
  description: >
    BIAN Service Domain 'Payment Order' (Process) on the 'Payment Order
    Procedure' control record — payment intake, validation, and routing to
    Payment Execution. States: RECEIVED → VALIDATED → SUBMITTED →
    COMPLETED | FAILED; REJECTED at validation; CANCELLED only before the
    execution hand-off.
  version: 0.2.0
servers:
  - url: /
  - url: /sd-payment-order
    description: through the platform gateway

paths:
  /v1/service-domain:
    get:
      operationId: getServiceDomain
      summary: Service domain metadata
      responses:
        "200": { description: SD identity and BIAN classification }

  /v1/payment-order-procedure/initiate:
    post:
      operationId: initiateOrder
      summary: "Initiate — receive + validate a payment order (auto-submits when valid)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [debtorAccountRef, creditorAccountRef, amountMinor]
              properties:
                debtorAccountRef: { type: string }
                creditorAccountRef: { type: string }
                amountMinor: { type: integer, format: int64, minimum: 1 }
                currency: { type: string, pattern: "^[A-Z]{3}$", default: INR }
                remittanceInfo: { type: string }
      responses:
        "201":
          description: >
            Order created — status SUBMITTED (valid, auto-submit on),
            VALIDATED (auto-submit off) or REJECTED (with statusReason).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }

  /v1/payment-order-procedure:
    get:
      operationId: listOrders
      summary: Retrieve (collection)
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PaymentOrder" }

  /v1/payment-order-procedure/{orderId}/retrieve:
    get:
      operationId: retrieveOrder
      summary: Retrieve
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200":
          description: The order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentOrder" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/payment-order-procedure/{orderId}/submit:
    post:
      operationId: submitOrder
      summary: "Execute — hand off to Payment Execution (needed only with auto-submit off)"
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200": { description: Order SUBMITTED }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RuleViolation" }

  /v1/payment-order-procedure/{orderId}/control:
    put:
      operationId: cancelOrder
      summary: "Control — cancel (only before the execution hand-off)"
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [cancel] }
      responses:
        "200": { description: Order CANCELLED }
        "400": { $ref: "#/components/responses/Invalid" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RuleViolation" }

  /v1/payment-order-procedure/{orderId}/execution-result:
    put:
      operationId: applyExecutionResult
      summary: "Outcome callback from Payment Execution (SUBMITTED orders only)"
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [completed]
              properties:
                completed: { type: boolean }
                reason: { type: string }
      responses:
        "200": { description: Order COMPLETED or FAILED }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/RuleViolation" }

components:
  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string }

  responses:
    NotFound:
      description: Unknown order
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RuleViolation:
      description: State forbids this (already submitted, terminal, not validated…)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Invalid:
      description: Bad input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    PaymentOrder:
      type: object
      properties:
        orderId: { type: string, example: "PO-…" }
        debtorAccountRef: { type: string }
        creditorAccountRef: { type: string }
        amountMinor: { type: integer, format: int64 }
        currency: { type: string }
        remittanceInfo: { type: string, nullable: true }
        status:
          type: string
          enum: [RECEIVED, VALIDATED, REJECTED, SUBMITTED, COMPLETED, FAILED, CANCELLED]
        statusReason: { type: string, nullable: true }
        receivedAt: { type: string, format: date-time }
        submittedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }

    Error:
      type: object
      properties:
        code: { type: string, example: ALREADY_SUBMITTED }
        message: { type: string }
